name: FutPulse Worker CI

on:
  push:
    branches:
      - feat/futpulse-football-api
  pull_request:
    branches:
      - main
      - feat/futpulse-football-api
    paths:
      - "worker/**"
      - ".github/workflows/worker-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-check:
    name: TypeScript and Wrangler dry run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Worker TypeScript
        run: npx --yes --package typescript@5.7.3 tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022,DOM,DOM.Iterable worker/src/index.ts worker/src/providers/apiFootball.ts

      - name: Validate Worker bundle without deploying
        run: npx --yes wrangler@4 deploy --dry-run --config worker/wrangler.jsonc
